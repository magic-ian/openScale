name: Multiplatform CI

on:
  push:
    branches: [ master, develop, 'copilot/**' ]
  pull_request:
    branches: [ master, develop ]

permissions:
  contents: read

jobs:
  build-shared:
    name: Build Shared Module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build shared module
      run: ./gradlew :shared:build
      working-directory: .
      
    - name: Run shared module tests
      run: ./gradlew :shared:test
      working-directory: .

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: build-shared
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build Android debug APK
      run: ./gradlew assembleDebug
      working-directory: android_app
      
    - name: Run Android tests
      run: ./gradlew test
      working-directory: android_app

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    needs: build-shared
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    # Install GTK development libraries (will be needed when UI is implemented)
    # - name: Install GTK dependencies
    #   run: |
    #     sudo apt-get update
    #     sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
          
    - name: Build Linux app
      run: ./gradlew build
      working-directory: linux_app
      
    - name: Run Linux app tests
      run: ./gradlew test
      working-directory: linux_app

  validate-structure:
    name: Validate Multiplatform Structure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate project structure
      run: |
        echo "Checking multiplatform structure..."
        test -f settings.gradle.kts || exit 1
        test -f build.gradle.kts || exit 1
        test -d shared/src/commonMain || exit 1
        test -d shared/src/androidMain || exit 1
        test -d shared/src/linuxMain || exit 1
        test -d android_app || exit 1
        test -d linux_app || exit 1
        test -f ARCHITECTURE.md || exit 1
        test -f CONTRIBUTING.md || exit 1
        echo "✓ All required directories and files exist"
        
    - name: Validate documentation
      run: |
        echo "Checking documentation..."
        test -f shared/README.md || exit 1
        test -f linux_app/README.md || exit 1
        grep -q "Linux Mobile" README.md || exit 1
        grep -q "Kotlin Multiplatform" ARCHITECTURE.md || exit 1
        echo "✓ Documentation is complete"
